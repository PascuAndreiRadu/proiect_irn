[project]
name = "proiect-irn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "notebook>=7.6.4",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "torch>=2.15.0",
]

[project.scripts]
proiect-irn = "proiect_irn:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
